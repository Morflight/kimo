[workspace]
resolver = "2"
members = ["crates/kimo-core", "crates/kimo-mcp", "crates/kimo-cli"]

[workspace.package]
version = "9.0.0"
edition = "2021"
license = "MIT"

# Test builds: CI and the local coverage runner set CARGO_PROFILE_TEST_OPT_LEVEL=1 for the workspace crates
# (faster to compile under coverage); dependencies stay at opt-level 2 so the media/ML libraries keep running
# fast in tests and their build cache is not invalidated.
[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

# Gate profile (V3-1b): same code generation as release minus the cost that is not needed to run proofs: no LTO, no debuginfo, parallel codegen units.
# Used by tests/gate_fast.sh and tests/gate_full.sh (cargo test --profile gate). Release stays the shipping profile.
[profile.gate]
inherits = "release"
lto = false
debug = 0
codegen-units = 16
incremental = true
