name: quality
# Test strategy (docs/TESTING_STRATEGY.md): every push on every branch runs the fast suite;
# pull requests to main and pushes to main run the heavy suite (every test, including
# #[ignore] proofs) as the last safeguard before main changes.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Rust nextest profile: fast or heavy"
        type: choice
        options: [fast, heavy]
        default: heavy
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: feature-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check inventory and coherence
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            python3 tools/quality/check_contracts.py --base "$BASE"
          else
            python3 tools/quality/check_contracts.py
          fi
          python3 tests/gate_check.py
          python3 tools/quality/check_test_strategy.py
          python3 -m unittest discover -s tools/quality -p 'test_*.py'
          git diff --exit-code
  javascript:
    name: javascript-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Chromium coverage dependencies
        run: |
          python3 -m pip install playwright==1.58.0 pillow==12.1.0
          python3 -m playwright install --with-deps chromium --only-shell
      - name: Record controller execution
        run: >-
          npm exec --yes --package=c8@10.1.3 -- c8
          --temp-directory coverage/v8
          --all --src crates/kimo-gui/ui --include 'crates/kimo-gui/ui/**/*.js' --exclude '**/vendor/**'
          --reporter json
          bash tools/fork/test-ui.sh
      - name: Record additional Chromium functional execution
        if: always()
        run: python3 tools/quality/run_browser_tests.py --coverage-output coverage/v8 --output coverage/browser-results
      - name: Require complete combined JavaScript coverage
        if: always()
        run: |
          set -euo pipefail
          python3 -c "from tools.quality.browser_coverage import verify_sources; verify_sources('coverage/v8')"
          npm exec --yes --package=c8@10.1.3 -- c8 report \
            --temp-directory coverage/v8 \
            --all --src crates/kimo-gui/ui --include 'crates/kimo-gui/ui/**/*.js' --exclude '**/vendor/**' \
            --check-coverage --per-file --lines 100 --functions 100 --branches 100 --statements 100 \
            --reporter text --reporter json --reporter lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: javascript-coverage
          path: coverage/
          if-no-files-found: error
  python:
    name: python-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python3 -m pip install coverage==7.6.12
          python3 -m coverage run --branch --source=crates/kimo-core/src,tools/quality -m unittest discover -s tools/quality -p 'test_*.py'
          python3 -m coverage json -o python-coverage.json
          python3 tools/quality/check_python_coverage.py python-coverage.json
          python3 -m coverage report --fail-under=100
      - if: always()
        run: python3 -m coverage json -o python-coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: python-coverage
          path: python-coverage.json
          if-no-files-found: error
  browser:
    name: browser-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install isolated browser test dependencies
        run: |
          python3 -m pip install playwright==1.58.0 pillow==12.1.0
          python3 -m playwright install --with-deps chromium --only-shell
      - name: Run every browser proof and recovery variants
        run: python3 tools/quality/run_browser_tests.py --output browser-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-results
          path: browser-results/
          if-no-files-found: error
  rust:
    name: rust-coverage (${{ matrix.os }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Windows only: kimo is built and used on Windows. The owner dropped the Linux Rust jobs on
        # 2026-11-20 (docs/QUALITY.md); JavaScript, Python, browser and contract jobs stay on Linux runners.
        os: [windows-latest]
        scope: [workspace, desktop]
    env:
      # .config/nextest.toml: `fast` excludes the registered heavy tests, `heavy` runs all.
      SUITE: ${{ inputs.suite || ((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'heavy' || 'fast') }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Keep debug assertions and every test, but avoid unoptimized renderer overhead. Level 1 for the
      # workspace crates (faster coverage compiles); dependencies stay at 2 via [profile.test.package."*"].
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # The preset fonts fetched by fonts/fetch.sh. The build target lives outside the checkout (see below), so the
      # executable-relative lookup of text::font_dirs never reaches <repo>/fonts; without this, preset fonts fall back.
      KIMO_FONTS: ${{ github.workspace }}/fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use the Windows volume with most free space for build artifacts
        shell: pwsh
        run: |
          $buildDrive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in @('C', 'D') } | Sort-Object Free -Descending | Select-Object -First 1
          if (-not $buildDrive) { throw 'No Windows build volume available' }
          $buildTarget = Join-Path $buildDrive.Root 'kimo-coverage-target'
          New-Item -ItemType Directory -Force -Path $buildTarget | Out-Null
          "CARGO_TARGET_DIR=$buildTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Build target' $buildTarget 'free GiB' ([math]::Round($buildDrive.Free / 1GB, 1))
      - name: Install the full Windows FFmpeg build required by export tests
        shell: pwsh
        run: |
          choco install ffmpeg-full -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg full installation failed' }
          $package = Join-Path $env:ChocolateyInstall 'lib/ffmpeg-full'
          $ffmpegBinary = Get-ChildItem -Path $package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegBinary) { throw 'FFmpeg full executable was not installed' }
          $ffmpegDirectory = $ffmpegBinary.Directory.FullName
          $ffmpegDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $encoders = & $ffmpegBinary.FullName -hide_banner -encoders 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($encoders -match '\blibsvtav1\b')) { throw 'The full FFmpeg build must provide libsvtav1' }
          & (Join-Path $ffmpegDirectory 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'The matching ffprobe executable is required' }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component llvm-tools-preview
          rustup default 1.100.0
          bash fonts/fetch.sh
      # Prebuilt, version-pinned binaries instead of compiling the tools every run.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.152
      # Dependency build cache (workspace crates are always rebuilt and measured).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.scope }}-coverage
          workspaces: |
            . -> target
            crates/kimo-gui -> target
      - name: Native code-clip browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.58.0 pillow==12.1.0
          python3 -m playwright install chromium --only-shell
      - name: Prepare native proof inputs and output directories
        if: matrix.scope == 'workspace'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, subprocess, tempfile, urllib.request
          root = pathlib.Path(tempfile.gettempdir())
          faceocc = root / 'faceocc2.webm'
          url = 'https://raw.githubusercontent.com/opencv/opencv_extra/ebf9366b3845efe1e54bf2440cf238fd68905bab/testdata/cv/tracking/faceocc2/data/faceocc2.webm'
          urllib.request.urlretrieve(url, faceocc)
          assert hashlib.sha256(faceocc.read_bytes()).hexdigest() == '5ffedeca4fb3acfd65e6f6aa71f016f748628727be1e24914fde2198b42089c5'
          image = root / 'perf1080.rgba'
          subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i',
              'crates/kimo-core/src/vision/testdata/astronaut_176x220.ppm',
              '-vf', 'scale=1920:1080', '-frames:v', '1', '-pix_fmt', 'rgba', '-f', 'rawvideo', str(image)], check=True)
          assert image.stat().st_size == 1920 * 1080 * 4
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'KIMO_FACEOCC2_WEBM={faceocc}\n')
              for key in ['KIMO_CSM_FRAMES', 'KIMO_PBR_FRAMES', 'KIMO_PRIMITIVE_FRAMES',
                          'KIMO_CAMERA_FRAMES', 'KIMO_PARTICLE_FRAMES', 'KIMO_TRANSITION_FRAMES', 'KIMO_UV_FRAMES']:
                  directory = root / 'kimo-native-proofs' / key
                  directory.mkdir(parents=True, exist_ok=True)
                  env.write(f'{key}={directory}\n')
              env.write(f'KIMO_3D_FRAME={root / "kimo-native-proofs" / "foundation.png"}\n')
          PYTHON
      - name: Workspace tests and coverage
        if: matrix.scope == 'workspace'
        shell: bash
        run: |
          set -euo pipefail
          # nextest runs each test in its own process, so tests that mutate
          # process-wide model/cache/resource environment cannot interfere while
          # running in parallel. The heavy suite also runs every #[ignore] proof.
          ignored=default; [[ "$SUITE" == heavy ]] && ignored=all
          cargo llvm-cov nextest --locked --workspace --all-targets --no-report --profile "$SUITE" --run-ignored "$ignored"
      - name: Report workspace coverage even when a test fails
        if: always() && matrix.scope == 'workspace'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality/rust_coverage_report.py --output-path rust-workspace.json
          python3 tools/quality/check_rust_coverage.py --prefix crates/kimo-core/ rust-workspace.json
          python3 tools/quality/check_rust_coverage.py --prefix crates/kimo-cli/ rust-workspace.json
          python3 tools/quality/check_rust_coverage.py --prefix crates/kimo-mcp/ rust-workspace.json
      - name: Build real engine for the required desktop probe
        if: matrix.scope == 'desktop'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p kimo-mcp
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          binary = pathlib.Path(metadata['target_directory']) / 'debug' / 'kimo-mcp.exe'
          assert binary.is_file(), binary
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'KIMO_MCP_BIN={binary}\n')
          PYTHON
      - name: Desktop tests and coverage
        if: matrix.scope == 'desktop'
        shell: bash
        run: |
          set -euo pipefail
          ignored=default; [[ "$SUITE" == heavy ]] && ignored=all
          cargo llvm-cov nextest --locked --manifest-path crates/kimo-gui/Cargo.toml --all-targets --no-report --profile "$SUITE" --run-ignored "$ignored"
      - name: Report desktop coverage even when a test fails
        if: always() && matrix.scope == 'desktop'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality/rust_coverage_report.py --manifest-path crates/kimo-gui/Cargo.toml --output-path rust-desktop.json
          python3 tools/quality/check_rust_coverage.py --prefix crates/kimo-gui/ rust-desktop.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-coverage-${{ matrix.os }}-${{ matrix.scope }}
          path: rust-*.json
          if-no-files-found: error

  acceptance:
    name: quality-acceptance
    if: always()
    needs: [contracts, javascript, python, browser, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require every job and complete qualification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          policy = json.load(open('docs/features/catalog.json'))
          debt = [f['id'] for f in policy['features'] if f['status'] != 'verified']
          blockers = policy.get('qualification_blockers', [])
          if failed or debt or blockers:
              raise SystemExit(f'Not qualified: failed/pending jobs={failed}; unverified features={debt}; blockers={blockers}')
          PY
