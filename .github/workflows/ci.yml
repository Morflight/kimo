# Everyday CI: the full engine and app test suites on Windows and Linux, on every push and pull request.
# All failures, ignored tests and missing execution evidence block acceptance. No legacy waiver.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ffmpeg \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0 && rustc -V

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/kimo-gui/target
          key: ci-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'crates/kimo-gui/Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-

      - name: Fonts (SIL OFL) for text rendering tests
        shell: bash
        run: bash fonts/fetch.sh

      - name: Engine tests (gate profile, every target that builds on this OS)
        shell: bash
        run: |
          set -o pipefail
          # feature-gated targets are skipped (they need --features libav / flat-sah)
          ARGS=""
          for f in crates/kimo-core/tests/*.rs; do n=$(basename "$f" .rs); case "$n" in libav_vfr_conform|flat_sah) ;; *) ARGS="$ARGS --test $n";; esac; done
          cargo test --locked --profile gate -p kimo-core --lib $ARGS --no-fail-fast -- --test-threads=4 --include-ignored 2>&1 | tee engine-tests.log

      - name: App tests
        shell: bash
        working-directory: crates/kimo-gui
        run: |
          set -euo pipefail
          cargo test --locked --release --lib -- --include-ignored 2>&1 | tee ../../app-tests.log

      - name: Require complete passing test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/compare_failures.py engine-tests.log unused failures-now.txt
          python3 tools/ci/compare_failures.py app-tests.log unused app-failures-now.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            engine-tests.log
            app-tests.log
            failures-now.txt
