name: fork-preview
on:
  push:
    branches: [maintained]
  pull_request:
    branches: [maintained]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tools/fork/test-preview.sh
