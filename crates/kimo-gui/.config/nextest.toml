# cargo-nextest configuration for the desktop workspace (crates/kimo-gui is its own Cargo
# workspace, so nextest reads this file, not the repository-root one). Rules: docs/TESTING_STRATEGY.md.
# Same two profiles as the engine workspace: `fast` on every push, `heavy` (+ #[ignore] proofs via
# --run-ignored all) on pull requests to main and pushes to main.
# No desktop heavy test is registered: `fast` runs every non-ignored desktop test, and its 30 s
# per-test limit makes any slow test fail visibly rather than lengthen the fast suite.

# The telemetry and live-feed tests bind kimo's fixed default spectator ports 127.0.0.1:7421-7430.
# testutil::PORTS only serialized them inside one process; nextest runs each test in its own
# process, so this group runs them one at a time.
[test-groups]
spectator-ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/(^|::)(private_and_external_are_tagged|binds_loopback_only|all_public_ports_occupied_is_an_error_without_starting_a_listener|live_feed_tags_gui_and_external_engines)$/)"
test-group = "spectator-ports"

[profile.fast]
fail-fast = false
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "15s", terminate-after = 2 }

[profile.fast.junit]
path = "junit.xml"
store-failure-output = true

[profile.heavy]
fail-fast = false
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.heavy.junit]
path = "junit.xml"
store-failure-output = true
