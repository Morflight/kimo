[package]
autotests = false  # integration tests are declared below: one binary, tests/all
name = "kimo-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kimo-mcp"
path = "src/main.rs"

[dependencies]
kimo-core = { path = "../kimo-core" }
serde_json = "1"

# One integration test binary for the whole crate (see tests/all/main.rs).
[[test]]
name = "all"
path = "tests/all/main.rs"
