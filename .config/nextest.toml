# cargo-nextest configuration. Every test runs in its own process, so tests that
# change process-wide environment (model, cache, resource paths) cannot leak into
# one another; this replaces the former `--test-threads=1` serialization.
#
# Two required profiles split ONE suite by cost; no test is removed:
# - `ci`      every push: all non-ignored tests except the heavy set below.
# - `nightly` scheduled + required before any release: every test, including
#             `#[ignore]` proofs (`--run-ignored all`) and the heavy set.
# The heavy set is every test that took >= 5 s under LLVM coverage instrumentation
# (nextest, 3 threads, Linux, 2026-11-19 run of 59ee16b). The `ci` profile kills a
# test after 30 s, so a new slow test fails per-push CI until it is made faster or
# deliberately added here. See docs/QUALITY.md "Per-push and nightly suites".

[profile.ci]
fail-fast = false
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "15s", terminate-after = 2 }
default-filter = """
not (
  (binary_id(kimo-core) & test(=particle_flow::tests::pv3_frames)) |
  (binary_id(kimo-core) & test(=threed::csm::tests::dump_csm_frames)) |
  (binary_id(kimo-core) & test(=threed::lit_raster::tests::render_pbr_contact_sources)) |
  (binary_id(kimo-core) & test(=vision::tests::download::verified_download_and_resume)) |
  (binary_id(kimo-core) & test(=vision::tests::online_models_on_test_image)) |
  (binary_id(kimo-core::apply_review_fixes) & test(=applies_a_concrete_fix_and_the_transition_is_actually_gone)) |
